backlog:
  - tr: 92
    slug: gfm100_zero_sg
    title: "Zero-SG protection — 100% grid-forming inverter network"
    track: C
    priority: 1
    target_quarter: Q4-2026
    chapter_link: ["Ch.2", "Ch.3", "Ch.6"]
    novelty: 5
    key_deliverables:
      - "models/gfm100_network.py"
      - "coordination/gfm100_protection.py"
      - "tests/test_tr92_gfm100.py"
      - "TR92_gfm100/main_report92.pdf"
    summary: >
      100% GFM network (case14 all-inverter); characterise fault current
      suppression; show failure of classical 46/67; propose voltage-based
      differential + dV/dt trip; 60-scenario validation.

  - tr: 93
    slug: black_start_gfm
    title: "Black-start and restoration with GFM inverters"
    track: C
    priority: 2
    target_quarter: Q4-2026
    chapter_link: ["Ch.6", "Ch.7"]
    novelty: 4
    key_deliverables:
      - "models/black_start_engine.py"
      - "tests/test_tr93_blackstart.py"
      - "TR93_blackstart/main_report93.pdf"
    summary: >
      Stage machine: ENERGISE → PICK_UP_LOAD → SYNCHRONISE; trip blocking during
      dead-bus energisation; GFM V-ramp with current limit; synchrocheck (25) for
      GFM; 30-scenario validation (≥ 90% correct, zero nuisance trips).

  - tr: 94
    slug: rocof_inertia_less
    title: "Inertia-less frequency protection (Relay 81 redesign)"
    track: C
    priority: 3
    target_quarter: Q4-2026
    chapter_link: ["Ch.6"]
    novelty: 4
    key_deliverables:
      - "coordination/adaptive_rocof.py"
      - "tests/test_tr94_rocof.py"
      - "TR94_rocof/main_report94.pdf"
    summary: >
      Adaptive ROCOF estimator using GOOSE-broadcast virtual inertia H_v;
      dynamic df/dt threshold = f(H_v, ΔP); 2nd-order Butterworth anti-alias;
      40-scenario test; NERC PRC-006 compliance.

  - tr: 95
    slug: ieee2800_audit
    title: "IEEE 2800-2022 IBR interconnection requirements audit"
    track: D
    priority: 4
    target_quarter: Q1-2027
    chapter_link: ["Ch.1", "Ch.3"]
    novelty: 3
    key_deliverables:
      - "TR95_ieee2800/compliance_matrix.tex"
      - "TR95_ieee2800/main_report95.pdf"
    summary: >
      Map IEEE 2800-2022 §6–§9 to SAMBP functions; COMPLIANT/PARTIAL/NON-COMPLIANT
      matrix; gap remediation proposals; traceability table thesis ↔ standard clauses.

  - tr: 96
    slug: iec61850_ed3_key_mgmt
    title: "IEC 61850 Edition 3 + IEC 62351-8 key management"
    track: D
    priority: 5
    target_quarter: Q1-2027
    chapter_link: ["Ch.9"]
    novelty: 3
    key_deliverables:
      - "integration/key_management_server.py"
      - "tests/test_tr96_iec61850ed3.py"
      - "TR96_iec61850ed3/main_report96.pdf"
    summary: >
      Ed.3 delta analysis vs. Ed.2 (TR-06/14/82); IEC 62351-8 KeyServer simulation
      (certificate rotation, grace period); integration with GOOSESecurityLayer (TR-82);
      GOOSE latency with/without HMAC.

  - tr: 97
    slug: cyber_threat_iec62443
    title: "Cyber-physical threat modelling (IEC 62443 threat tree)"
    track: D
    priority: 6
    target_quarter: Q1-2027
    chapter_link: ["Ch.9"]
    novelty: 3
    key_deliverables:
      - "TR97_cyber_threat/threat_tree.tex"
      - "TR97_cyber_threat/main_report97.pdf"
    summary: >
      Attack surface: GOOSE spoofing, SV injection, MMS replay, firmware tamper;
      STRIDE threat tree; countermeasure mapping (TR-82 + TR-96); DREAD residual risk.

  - tr: 98
    slug: sensitivity_cramer_rao
    title: "Full SAMBP sensitivity analysis and Cramér–Rao bounds"
    track: E
    priority: 7
    target_quarter: Q2-2027
    chapter_link: ["all"]
    novelty: 4
    key_deliverables:
      - "estimation/sensitivity_analysis.py"
      - "TR98_sensitivity/main_report98.pdf"
    summary: >
      ±10% EKF parameter perturbation → Δagree_rate; Fisher information matrix;
      CRLB for k_ibr and f_gfm vs. EKF covariance; tornado chart; robustness
      certificate: PD ≥ 0.97, PFA ≤ 0.01 for ±20% parameter error.

  - tr: 99
    slug: cross_chapter_audit
    title: "Cross-chapter consistency audit"
    track: E
    priority: 8
    target_quarter: Q2-2027
    chapter_link: ["all"]
    novelty: 2
    key_deliverables:
      - "01_thesis/audit/consistency_report.tex"
      - "TR99_audit/main_report99.pdf"
    summary: >
      Proposition/theorem inventory; unified symbol table (flag conflicts);
      figure-to-script traceability; citation completeness; chapter dependency DAG.

  - tr: 100
    slug: submission_readiness
    title: "Submission readiness — final LaTeX + bibliography"
    track: E
    priority: 9
    target_quarter: Q3-2028
    chapter_link: ["all"]
    novelty: 2
    key_deliverables:
