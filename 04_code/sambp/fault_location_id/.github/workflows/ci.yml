name: fault_location_id CI

on:
  push:
    branches: [main]
    paths:
      - "04_code/sambp/fault_location_id/**"
  pull_request:
    branches: [main]
    paths:
      - "04_code/sambp/fault_location_id/**"

defaults:
  run:
    working-directory: 04_code/sambp/fault_location_id

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

  matlab:
    name: MATLAB sym/eig smoke (optional)
    runs-on: ubuntu-latest
    needs: python
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a
          products: |
            Symbolic_Math_Toolbox
            Signal_Processing_Toolbox
            Control_System_Toolbox
            Optimization_Toolbox

      - name: Run MATLAB sym/eig smoke (WP0.4 sub-task 4)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            cd('04_code/sambp/fault_location_id');
            addpath('matlab');
            run_smoke
