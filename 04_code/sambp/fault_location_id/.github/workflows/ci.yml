name: fault_location_id CI

on:
  push:
    branches: [main]
    paths:
      - "04_code/sambp/fault_location_id/**"
  pull_request:
    branches: [main]
    paths:
      - "04_code/sambp/fault_location_id/**"
  schedule:
    # Weekly DOI-watch: every Sunday at 03:17 UTC.  The doi-watch
    # job below is the only consumer of the schedule trigger.
    - cron: "17 3 * * 0"

defaults:
  run:
    working-directory: 04_code/sambp/fault_location_id

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

  doi-watch:
    name: DOI rot watch (weekly)
    runs-on: ubuntu-latest
    # Run on the weekly schedule, on direct push to references.bib /
    # the verifier itself, and on manual workflow_dispatch.  Skip on
    # PRs and on unrelated pushes.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && (
            contains(github.event.head_commit.message, 'references.bib')
            || contains(github.event.head_commit.message, 'verify_dois')
         ))
    needs: python
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev extras
        run: python -m pip install -e ".[dev]"

      - name: Verify DOIs in references.bib
        run: python tools/verify_dois.py docs/references.bib

      - name: Upload DOI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: references_doi_check
          path: 04_code/sambp/fault_location_id/docs/references_doi_check.csv

  matlab:
    name: MATLAB sym/eig smoke (optional)
    runs-on: ubuntu-latest
    needs: python
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a
          products: |
            Symbolic_Math_Toolbox
            Signal_Processing_Toolbox
            Control_System_Toolbox
            Optimization_Toolbox

      - name: Run MATLAB sym/eig smoke (WP0.4 sub-task 4)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            cd('04_code/sambp/fault_location_id');
            addpath('matlab');
            run_smoke
