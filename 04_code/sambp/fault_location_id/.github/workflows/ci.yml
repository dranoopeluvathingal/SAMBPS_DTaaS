name: fault_location_id CI

on:
  push:
    branches: [main]
    paths:
      - "04_code/sambp/fault_location_id/**"
  pull_request:
    branches: [main]
    paths:
      - "04_code/sambp/fault_location_id/**"

defaults:
  run:
    working-directory: 04_code/sambp/fault_location_id

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

  matlab:
    name: MATLAB smoke (optional)
    runs-on: ubuntu-latest
    needs: python
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a

      - name: Run MATLAB Phase-0 smoke
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath('04_code/sambp/fault_location_id/matlab'));
            run_phase0_smoke
