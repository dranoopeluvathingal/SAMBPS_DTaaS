[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fs_mpc_mg"
version = "0.2.0"
description = "FS-MPC of microgrid interface converters for reactive power and harmonic compensation"
authors = [{name = "Anoop Eluvathingal", email = "ianoopeluvathingal@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "joblib>=1.3",
]
mqtt = [
    "paho-mqtt>=1.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 110
target-version = "py310"
